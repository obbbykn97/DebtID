name: Build APK

on:
  push:
    branches: [main]
    # documentation changes do not need a new APK
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # pull requests get the tests and a test APK (published releases come only from main)
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# read-only by default; only the job that publishes a release gets write access
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Core tests (interest math, signatures, codes, backups)
        run: node --test web/test/*.test.mjs
      - name: The bundled page matches web/src
        run: |
          python3 web/build.py "$RUNNER_TEMP/index.html"
          cmp "$RUNNER_TEMP/index.html" web/dist/index.html || { echo "::error::web/dist/index.html is out of date. Run: python3 web/build.py"; exit 1; }

  apk:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build the web page (web/src -> web/dist/index.html)
        run: python3 web/build.py web/dist/index.html

      # Secrets exist only for pushes and for pull requests opened from this repository (never from forks).
      # Test APKs from pull requests are signed with the same key, so they install over the current app.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBTID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBTID_KEYSTORE_PASSWORD }}
        run: |
          # tolerate stray line breaks or spaces around the pasted values
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/debtid.jks" 2>/dev/null; then
              echo "::error::DEBTID_KEYSTORE_B64 is not valid base64. Paste the whole block again, with nothing else."; exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/debtid.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error::The keystore does not open with DEBTID_KEYSTORE_PASSWORD. Check both secrets."; exit 1
            fi
            echo "DEBTID_KEYSTORE=$RUNNER_TEMP/debtid.jks" >> "$GITHUB_ENV"
            echo "DEBTID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::DEBTID_KEYSTORE_B64 / DEBTID_KEYSTORE_PASSWORD are not set: building a test APK (artifact only, no release). See the README."
          fi

      - name: Build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Continue after build 26 from DebtID-multi so Android accepts updates.
          RUN_NUMBER=$((RUN_NUMBER + 26))
          export DEBTID_VERSION_CODE=$((100 + RUN_NUMBER)) DEBTID_VERSION_NAME="2.$RUN_NUMBER"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DebtID.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DebtID-APK
          path: DebtID.apk

      # Only APKs from main signed with the permanent key are published, so updates always install over the previous version.
      - name: Publish release
        if: env.SIGNED_RELEASE == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          printf '%s\n' \
            "English: download \`DebtID.apk\` on your Android phone and open it to install." \
            "" \
            "Português: baixe o \`DebtID.apk\` no celular Android e abra o arquivo para instalar." \
            "" \
            "Español: descarga \`DebtID.apk\` en tu teléfono Android y ábrelo para instalarlo." > notes.md
          RUN_NUMBER=$((RUN_NUMBER + 26))
          gh release create "v2.$RUN_NUMBER" DebtID.apk \
            --title "DebtID 2.$RUN_NUMBER" \
            --notes-file notes.md \
            --latest || echo "::warning::Could not create the release; the APK is available under Artifacts."
