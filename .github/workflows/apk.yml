name: Build APK

on:
  push:
    branches: [main]
    # documentation changes do not need a new APK
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the web page (web/src -> web/dist/index.html)
        run: python3 web/build.py web/dist/index.html

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBTID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBTID_KEYSTORE_PASSWORD }}
        run: |
          # tolerate stray line breaks or spaces around the pasted values
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/debtid.jks" 2>/dev/null; then
              echo "::error::DEBTID_KEYSTORE_B64 is not valid base64. Paste the whole block again, with nothing else."; exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/debtid.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error::The keystore does not open with DEBTID_KEYSTORE_PASSWORD. Check both secrets."; exit 1
            fi
            echo "DEBTID_KEYSTORE=$RUNNER_TEMP/debtid.jks" >> "$GITHUB_ENV"
            echo "DEBTID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::DEBTID_KEYSTORE_B64 / DEBTID_KEYSTORE_PASSWORD are not set: building a test APK (artifact only, no release). See the README."
          fi

      - name: Build
        env:
          DEBTID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DebtID.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DebtID-APK
          path: DebtID.apk

      # Only APKs signed with the permanent key are published, so updates always install over the previous version.
      - name: Publish release
        if: env.SIGNED_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "**English:** download \`DebtID.apk\` on your Android phone and open it to install." \
            "" \
            "**Português:** baixe o \`DebtID.apk\` no seu celular Android e abra o arquivo para instalar." > notes.md
          gh release create "v1.${{ github.run_number }}" DebtID.apk \
            --title "DebtID 1.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest || echo "::warning::Could not create the release; the APK is available under Artifacts."
