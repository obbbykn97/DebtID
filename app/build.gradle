plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (on GitHub, from the repository secrets).
// Without them, the release APK is signed with the local debug key.
def keystorePath = System.getenv('DEBTID_KEYSTORE')
def buildNumber = (System.getenv('DEBTID_VERSION_CODE') ?: '1') as Integer

android {
    namespace 'app.debtid'
    compileSdk 35

    defaultConfig {
        applicationId 'app.debtid'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('DEBTID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DEBTID_KEY_ALIAS') ?: 'debtid'
                keyPassword System.getenv('DEBTID_KEY_PASSWORD') ?: System.getenv('DEBTID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // No minification: the JavaScript bridge (@JavascriptInterface) must keep its method names
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The app page is the same index.html as the web version, built into web/dist
    sourceSets {
        main {
            assets.srcDir "${rootDir}/web/dist"
        }
    }
}

dependencies {
    // Google Play services code scanner (the app itself needs no camera permission)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
